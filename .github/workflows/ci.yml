name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: "pytest · Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

  smoke:
    name: "Notebook smoke · Python 3.11"
    runs-on: ubuntu-latest
    needs: test
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and notebook dependencies
        run: pip install -e ".[dev,notebooks]"

      - name: Generate simulation output for notebooks
        run: |
          mkdir -p outputs
          PYTHONPATH=src python scripts/run_backtest.py \
            --config configs/baseline_mm.json \
            --output outputs/baseline_mm_result.json

      - name: Smoke-execute NB01
        run: |
          papermill notebooks/01_baseline_mm_analysis.ipynb /dev/null \
            -p result_json outputs/baseline_mm_result.json \
            --no-progress-bar

      - name: Smoke-execute NB02
        run: |
          papermill notebooks/02_execution_quality_analysis.ipynb /dev/null \
            -p result_json outputs/baseline_mm_result.json \
            --no-progress-bar

      - name: Smoke-execute NB03
        run: |
          papermill notebooks/03_funding_basis_arb_analysis.ipynb /dev/null \
            -p result_json outputs/baseline_mm_result.json \
            --no-progress-bar

      - name: Smoke-execute NB04
        run: |
          papermill notebooks/04_two_venue_latency_arb_analysis.ipynb /dev/null \
            -p result_json outputs/baseline_mm_result.json \
            --no-progress-bar
